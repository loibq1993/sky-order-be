# Backend: NestJS API + PostgreSQL — MÔI TRƯỜNG DEV (mount source, watch).
# Run from sky-order-be/: docker compose up -d
#
# Production (image build sẵn, node dist/main.js): docker compose -f docker-compose.prod.yml up -d --build
#
# Source được mount vào container — sửa code không cần build lại image backend.
# Lần đầu: chờ yarn install trong container xong. Thêm dependency mới: docker compose exec backend yarn add ...
# Image production (Dockerfile): dùng khi deploy CI/CD, không dùng bởi service backend bên dưới.
#
# Seed one-off: docker compose --profile seed run --rm seed
# Env: copy .env.example to .env
#
# Socket.IO: port 4500, path /socket.io

services:
  backend:
    image: node:20-alpine
    working_dir: /app
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 4500
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-sky_order_secret}
      DB_DATABASE: ${DB_DATABASE:-sky_order}
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_change_in_production}
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:80,http://127.0.0.1:3000}
      UPLOAD_PATH: ./uploads
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/uploads
      - backend_public:/app/public
    # Không dùng nest start --watch trong Docker: hook spawn node trước khi tsc ghi dist → MODULE_NOT_FOUND.
    # start:dev:docker = nest build --watch (compile) + nodemon chạy dist/main.js (ổn định trên bind mount).
    command: sh -c "corepack enable && yarn install && yarn start:dev:docker"
    ports:
      - "4500:4500"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sky-order-be

  seed:
    # Không đưa vào profile "mặc định" — tránh `docker compose up --build` bắt buộc có Dockerfile.seed.
    profiles:
      - seed
    build:
      context: .
      dockerfile: Dockerfile.seed
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-sky_order_secret}
      DB_DATABASE: ${DB_DATABASE:-sky_order}
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME:-superadmin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-admin123}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-superadmin@skyorder.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sky-order-be

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sky_order_secret}
      POSTGRES_DB: ${DB_DATABASE:-sky_order}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sky-order-be

volumes:
  postgres_data:
  backend_node_modules:
  backend_uploads:
  backend_public:

networks:
  sky-order-be:
    driver: bridge
